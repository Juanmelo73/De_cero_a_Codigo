<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprobar número primo</title>
</head>

<body>
    <main>
        <h1>Comprobar si un número es primo</h1>
        <label for="numero">Introduce un número entero:</label>
        <input id="numero" type="number" step="1" required>
        <button id="comprobar" type="button">Comprobar</button>
        <p id="resultado" role="status"></p>
    </main>

    <script src="isprime.js"></script>
</body>

</html>
